<html lang="hu">
<head>

<style>
/* VOICE: a modern, friendly music app, few words, big touch targets
   IDEA: a pocket groovebox: lit pads in soft cards, one round play button
   PICTURE: the pad grid with a moving playhead, front and centre
   COLOUR and TYPE: clean light or deep ground, coral for drums, cobalt for bass and chords, magenta for melody; Plus Jakarta Sans
   LAYOUT: sticky transport, then chords, tabbed pad editor, mixer, export */

:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(14px,3vw,32px) max(4vw,12px) 40px}
h1{font-size:clamp(34px,5vw,48px);line-height:1.05;margin:0 0 14px;font-weight:800;letter-spacing:-.03em}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,20,35,.04),0 8px 28px rgba(15,20,35,.06)}
.top{position:sticky;top:8px;z-index:5}
h2{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
input,select,button{font:inherit;font-size:16px;color:var(--ink)}
input[type=number],select{background:var(--pad);border:0;border-radius:12px;height:44px;padding:0 12px}
input[type=number]{width:90px}
button{cursor:pointer;border-radius:999px;border:0;background:var(--pad);min-height:44px;padding:0 16px;font-weight:600;transition:transform .12s}
button:active{transform:scale(.97)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--co);outline-offset:2px}
.play{width:56px;height:56px;padding:0;background:var(--or);color:#fff;font-size:20px;box-shadow:0 6px 18px rgba(255,90,54,.35)}
.play.on{background:var(--ink);color:var(--card);box-shadow:none}
.pri{background:var(--co);color:#fff}
.chip[aria-pressed=true]{background:var(--ink);color:var(--card)}
.grow{flex:1}
.chords{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.chords select{width:100%;font-size:15px}
.chords select.now{box-shadow:0 0 0 3px var(--co)}
.tabs{display:inline-flex;background:var(--pad);border-radius:999px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{background:none;min-height:38px}
.tabs button[aria-selected=true]{background:var(--card);box-shadow:0 2px 8px rgba(15,20,35,.1)}
.ed-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.scroll{overflow-x:auto;padding-bottom:4px}
.seq{min-width:540px}
.row{display:grid;grid-template-columns:80px repeat(16,minmax(0,1fr));gap:4px;margin-bottom:4px;align-items:center}
.lab{font-size:13px;text-align:left;min-height:32px;padding:0 8px;border-radius:10px;background:none;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lab.m{color:var(--mute);text-decoration:line-through}
span.lab{display:flex;align-items:center;color:var(--mute)}
.c{height:34px;min-height:0;padding:0;border-radius:9px;background:var(--pad)}
.c.b{background:var(--padb)}
.c.d.on{background:var(--or);box-shadow:0 3px 10px rgba(255,90,54,.35)}
.c.bs.on{background:var(--co);box-shadow:0 3px 10px rgba(47,91,255,.35)}
.c.ld.on{background:var(--mg);box-shadow:0 3px 10px rgba(226,48,127,.35)}
.c.now{outline:2px solid var(--ink);outline-offset:-2px}
.small .c{height:26px;border-radius:7px}
.mix{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px 18px}
.mix label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;font-weight:600}
input[type=range]{width:100%;accent-color:var(--co);height:32px}
#status{font-size:14px;margin-top:8px;min-height:1.5em;color:var(--mute)}
#status:empty{display:none}
audio{width:100%;margin-top:10px}
.chk{display:flex;gap:8px;align-items:center;min-height:44px;font-size:15px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--co)}
.txt{background:var(--pad);border:0;border-radius:12px;height:44px;padding:0 12px;min-width:160px;flex:1}
.clip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.clip b{flex:1 1 140px;font-weight:600}.tag{font-size:13px;color:var(--mute)}
.clip button{min-height:38px;padding:0 12px;font-size:14px}
.lane{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(60px,150px);gap:10px;align-items:center;margin-bottom:8px}
.lane select{width:100%}.lane .ed{font-weight:600}
.tog{border-radius:12px;font-weight:800;padding:0}.tog.on{background:var(--or);color:#fff;box-shadow:0 4px 14px rgba(255,90,54,.35)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  </div>

  <div class="card">
    <h2 data-t="mixer"></h2>

    <audio id="prev" controls hidden></audio>
  </div>
</div>

  if(tab==='ld'){$('sound').innerHTML=opt(LEADS,st.leadS,'l_');h=`<div class="small">`+[7,6,5,4,3,2,1,0].map(r=>`<div class="row"><span class="lab">${NOTES[mid(r,72)%12]}</span>${cells('ld',s=>st.lead[s]===r,`data-ld="${r}"`)}</div>`).join('')+`</div>`}
  $('seq').innerHTML=h;
  $('mix').innerHTML=TR.map(([k,n])=>`<label><span class="${st.mute[k]?'lab m':''}" style="padding:0">${tr(n)}</span><input type="range" min="0" max="1" step="0.01" value="${st.vol[k]}" data-vol="${k}"></label>`).join('')+`<label>${tr('reverb')}<input type="range" min="0" max="1" step="0.01" value="${st.reverb}" data-vol="reverb"></label>`;
  $('cparts').innerHTML=PARTS.map(([k,n])=>`<button class="chip" data-cp="${k}" aria-pressed="${!!st.cparts[k]}">${tr(n)}</button>`).join('');
  $('clips').innerHTML=st.clips.length?'':`<div class="empty">${tr('empty')}</div>`;$('clips').innerHTML+=st.clips.map(c=>`<div class="clip"><b>${esc(c.name)}</b><span class="tag">${c.type==='audio'?tr('audioTag',{b:c.bars})+(AUD[c.id]?'':tr('na')):PARTS.filter(([k])=>c.parts[k]).map(x=>tr(x[1])).join(' · ')}</span>${c.type==='audio'?'':`<button data-act="load" data-cl="${c.id}">${tr('edit')}</button><button data-act="upd" data-cl="${c.id}">${tr('upd')}</button>`}<button data-act="del" data-cl="${c.id}">${tr('del')}</button></div>`).join('');
  const copts=st.clips.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('lanes').innerHTML=`<div class="lane"><button class="tog ${st.edOn?'on':''}" data-ed="1" aria-pressed="${st.edOn}" aria-label="${tr('edTog')}">▶</button><span class="ed">${tr('editor')}</span><span></span></div>`+
    st.lanes.map((L,i)=>`<div class="lane"><button class="tog ${L.on?'on':''}" data-lt="${i}" aria-pressed="${L.on}" aria-label="${tr('laneTog',{n:i+1})}">${i+1}</button><select data-lc="${i}" aria-label="${tr('laneClip',{n:i+1})}"><option value="">${tr('emptyOpt')}</option>${copts}</select><input type="range" min="0" max="1" step="0.01" value="${L.vol}" data-lv="${i}" aria-label="${tr('laneVol',{n:i+1})}"></div>`).join('');
  document.querySelectorAll('#lanes select').forEach((x,i)=>x.value=st.lanes[i].clip||'');
  paintHead();persist();
}
function demo(){const E=ensure(),t=E.ctx.currentTime+.02,d=st.prog[0];
  if(tab==='dr'){V.kick(E,t);V.hat(E,t+.15);V.snare(E,t+.3);V.hat(E,t+.45)}
  if(tab==='bs')V.bass(E,t,mid(d,36),.4);
  if(tab==='ld'){V.lead(E,t,mid(0,72),.2);V.lead(E,t+.22,mid(2,72),.2);V.lead(E,t+.44,mid(4,72),.3)}}
$('root').innerHTML=NOTES.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
$('tabs').addEventListener('click',ev=>{const b=ev.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render()});
$('sound').onchange=()=>{const v=$('sound').value;if(tab==='dr')st.kit=v;if(tab==='bs')st.bassS=v;if(tab==='ld')st.leadS=v;if(LE)setGains(LE);persist();if(!timer)demo()};
$('chordS').onchange=()=>{st.chordS=$('chordS').value;persist();if(!timer){const E=ensure();V.chord(E,E.ctx.currentTime+.02,chordMidis(st.prog[0]),1)}};
$('crh').onchange=()=>{st.crh=$('crh').value;persist()};
$('seq').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.mute){const k=b.dataset.mute;st.mute[k]=!st.mute[k];if(LE)setGains(LE);render();return}
  const s=+b.dataset.s;if(isNaN(s))return;st.edOn=true;const E=ensure(),t=E.ctx.currentTime+.01,d=st.prog[timer?curBar:0];
  if(b.dataset.dr){const k=b.dataset.dr;st.drums[k][s]^=1;if(st.drums[k][s]&&!timer)V[k](E,t)}
  else if(b.dataset.bs){const r=+b.dataset.bs;st.bass[s]=st.bass[s]===r?-1:r;if(st.bass[s]>=0&&!timer)V.bass(E,t,mid(d+[7,4,2,0][r],36),.25)}
  else if(b.dataset.ld){const r=+b.dataset.ld;st.lead[s]=st.lead[s]===r?-1:r;if(st.lead[s]>=0&&!timer)V.lead(E,t,mid(r,72),.25)}
  render();
});
$('chords').addEventListener('change',ev=>{const x=ev.target;if(x.dataset.bar){snap();st.prog[+x.dataset.bar]=+x.value;persist()}});
$('mix').addEventListener('input',ev=>{const k=ev.target.dataset.vol;if(!k)return;if(k==='reverb')st.reverb=+ev.target.value;else st.vol[k]=+ev.target.value;if(LE)setGains(LE);persist()});
$('moods').addEventListener('click',ev=>{const b=ev.target.closest('[data-mood]');if(!b)return;snap();st.edOn=true;generate(b.dataset.mood);if(LE)setGains(LE);render()});
$('gen').onclick=()=>{snap();st.edOn=true;generate(st.mood);if(LE)setGains(LE);render()};
$('undo').onclick=()=>{const p=hist.pop();if(p){st=JSON.parse(p);if(LE)setGains(LE);render()}};
$('clear').onclick=()=>{snap();st.drums=emptyDrums();st.bass=e();st.lead=e();render()};
$('bpm').onchange=()=>{st.bpm=Math.max(60,Math.min(180,+$('bpm').value||90));if(LE)setGains(LE);render()};
$('root').onchange=()=>{st.root=+$('root').value;render()};
$('scale').onchange=()=>{st.scale=$('scale').value;render()};
$('swing').oninput=()=>{st.swing=+$('swing').value;persist()};
$('len').onchange=()=>{st.len=Math.max(10,Math.min(600,+$('len').value||60));render()};
$('intro').onchange=()=>{st.intro=$('intro').checked;persist()};

/* ---------- clips and lanes ---------- */
const PARTS=['dr','bs','ch','ld'].map(k=>[k,'p_'+k]);
const AUD={};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newId=()=>'c'+Date.now().toString(36)+Math.floor(R()*1e4).toString(36);
const capture=()=>JSON.parse(JSON.stringify({prog:st.prog,drums:st.drums,bass:st.bass,lead:st.lead,kit:st.kit,bassS:st.bassS,chordS:st.chordS,crh:st.crh,leadS:st.leadS}));
let DBP=null;
function db(){if(!DBP)DBP=new Promise((res,rej)=>{try{const r=indexedDB.open('ferryfree',1);r.onupgradeneeded=()=>r.result.createObjectStore('audio');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(er){rej(er)}});return DBP}
async function idb(mode,k,v){try{const d=await db();return await new Promise(r=>{const os=d.transaction('audio',mode==='get'?'readonly':'readwrite').objectStore('audio');const q=mode==='get'?os.get(k):mode==='put'?os.put(v,k):os.delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(_){return null}}
function laneFree(id){const i=st.lanes.findIndex(L=>!L.clip);if(i>=0)st.lanes[i].clip=id;return i}
$('cparts').addEventListener('click',ev=>{const b=ev.target.closest('[data-cp]');if(!b)return;st.cparts[b.dataset.cp]=st.cparts[b.dataset.cp]?0:1;render()});
$('csave').onclick=()=>{const pt=Object.assign({},st.cparts);if(!PARTS.some(([k])=>pt[k])){$('cst').textContent=tr('pickPart');return}
  snap();const n=$('cname').value.trim()||tr('clipDef',{n:st.clips.filter(c=>c.type!=='audio').length+1}),id=newId();
  st.clips.push({id,name:n,parts:pt,data:capture()});const i=laneFree(id);$('cname').value='';
  if(i>=0){st.lanes[i].on=true;st.edOn=false;if(LE){LE.pend[i]=true;setGains(LE)}}
  $('cst').textContent=i>=0?tr('savedLane',{name:n,art:art(i+1),n:i+1}):tr('saved',{name:n});render()};
$('caud').onclick=()=>$('caudf').click();
$('caudf').onchange=async()=>{const f=$('caudf').files[0];$('caudf').value='';if(!f)return;$('cst').textContent=tr('loading');
  try{const ab=await f.arrayBuffer(),E=ensure(),buf=await E.ctx.decodeAudioData(ab.slice(0)),id=newId(),bars=Math.max(1,Math.round(buf.duration/(16*stepDur())));
    AUD[id]=ab;E.dec[id]=buf;idb('put',id,ab);snap();st.clips.push({id,type:'audio',name:f.name.replace(/\.[^.]+$/,''),bars});const i=laneFree(id);
    $('cst').textContent=i>=0?tr('audAddedLane',{b:bars,art:art(i+1),n:i+1}):tr('audAdded',{b:bars});render()}
  catch(_){$('cst').textContent=tr('badFile')}};
$('clips').addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const c=clipById(b.dataset.cl);if(!c)return;snap();
  if(b.dataset.act==='load'){Object.assign(st,JSON.parse(JSON.stringify(c.data)));st.drums=Object.assign(emptyDrums(),st.drums);st.cparts=Object.assign({},c.parts);$('cname').value=c.name;$('cst').textContent=tr('inEditor',{name:c.name})}
  if(b.dataset.act==='upd'){c.data=capture();c.parts=Object.assign({},st.cparts);$('cst').textContent=tr('updated',{name:c.name})}
  if(b.dataset.act==='del'){st.clips=st.clips.filter(x=>x!==c);st.lanes.forEach((L,i)=>{if(L.clip===c.id){L.clip=null;L.on=false;if(LE)stopAud(LE,i)}});if(c.type==='audio'){delete AUD[c.id];idb('del',c.id)}$('cst').textContent=tr('deleted')}
  if(LE)setGains(LE);render()});
$('lanes').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.ed){st.edOn=!st.edOn;render();return}
  const i=+b.dataset.lt,L=st.lanes[i];L.on=!L.on;if(LE){if(L.on)LE.pend[i]=true;else stopAud(LE,i);setGains(LE)}render()});
$('lanes').addEventListener('change',ev=>{const x=ev.target;if(x.dataset.lc==null)return;const i=+x.dataset.lc;st.lanes[i].clip=x.value||null;if(LE){stopAud(LE,i);LE.pend[i]=true}persist()});
$('lanes').addEventListener('input',ev=>{const x=ev.target;if(x.dataset.lv==null)return;st.lanes[+x.dataset.lv].vol=+x.value;if(LE)setGains(LE);persist()});

/* ---------- export ---------- */
let DL=null;
(async()=>{try{if(window.claude&&window.claude.use)DL=await window.claude.use('downloads')}catch(_){}})();
function wav(buf){const n=buf.length,sr=buf.sampleRate,L=buf.getChannelData(0),Rc=buf.getChannelData(1);let pk=0;for(let i=0;i<n;i++){pk=Math.max(pk,Math.abs(L[i]),Math.abs(Rc[i]))}const k=pk>0?.95/pk:1;
  const ab=new ArrayBuffer(44+n*4),v=new DataView(ab);let p=0;const S=s=>{for(const c of s)v.setUint8(p++,c.charCodeAt(0))},U32=x=>{v.setUint32(p,x,true);p+=4},U16=x=>{v.setUint16(p,x,true);p+=2};
  S('RIFF');U32(36+n*4);S('WAVE');S('fmt ');U32(16);U16(1);U16(2);U32(sr);U32(sr*4);U16(4);U16(16);S('data');U32(n*4);
  for(let i=0;i<n;i++){const a=Math.max(-1,Math.min(1,L[i]*k)),b=Math.max(-1,Math.min(1,Rc[i]*k));v.setInt16(p,a<0?a*32768:a*32767,true);v.setInt16(p+2,b<0?b*32768:b*32767,true);p+=4}
  return new Uint8Array(ab)}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(d){let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=CRC[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(name,data){const nb=new TextEncoder().encode(name),crc=crc32(data),sz=data.length,dt=new Date(),dd=((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate();
  const lh=new Uint8Array(30+nb.length),a=new DataView(lh.buffer);a.setUint32(0,0x04034b50,true);a.setUint16(4,20,true);a.setUint16(12,dd,true);a.setUint32(14,crc,true);a.setUint32(18,sz,true);a.setUint32(22,sz,true);a.setUint16(26,nb.length,true);lh.set(nb,30);
  const cd=new Uint8Array(46+nb.length),c=new DataView(cd.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nb.length,true);cd.set(nb,46);
  const en=new Uint8Array(22),g=new DataView(en.buffer);g.setUint32(0,0x06054b50,true);g.setUint16(8,1,true);g.setUint16(10,1,true);g.setUint32(12,cd.length,true);g.setUint32(16,lh.length+sz,true);
  return new Blob([lh,data,cd,en])}
function parts(b,T){if(!st.intro)return ALL;if(b<2)return{chord:1,hat:1,shaker:1};if(b<4||b>=T-2)return{chord:1,hat:1,shaker:1,kick:1,bass:1};return ALL}
let lastUrl=null;
function plainDownload(name,data,type){const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
$('exp').onclick=async()=>{
  const sd=stepDur(),bd=16*sd,T=Math.max(4,Math.ceil(st.len/bd)),dur=T*bd+2.5,sr=44100;
  $('status').textContent=tr('rendering',{T,s:Math.round(T*bd)});$('exp').disabled=true;
  try{
    const ctx=new OfflineAudioContext(2,Math.ceil(sr*dur),sr),E=engine(ctx);
    for(const L of st.lanes){const c=clipById(L.clip);if(L.on&&c&&c.type==='audio'&&AUD[c.id]&&!E.dec[c.id])E.dec[c.id]=await ctx.decodeAudioData(AUD[c.id].slice(0))}
    if(st.intro){E.m.gain.setValueAtTime(.8,(T-1)*bd);E.m.gain.linearRampToValueAtTime(0,T*bd+1.5)}
    for(let b=0;b<T;b++){const P=parts(b,T);for(let s=0;s<16;s++)scheduleAll(E,.05+(b*16+s)*sd,b,s,P)}
    const buf=await ctx.startRendering(),w=wav(buf),name='ferryfree-'+(MOODS[st.mood]||{n:'mix'}).n.toLowerCase().replace(/[^a-z0-9]+/g,'')+'-'+st.bpm+'bpm';
    if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(new Blob([w],{type:'audio/wav'}));$('prev').src=lastUrl;$('prev').hidden=false;
    if(DL){$('status').textContent=tr('confirmDl');try{await DL.save({filename:name+'.zip',data:zip(name+'.wav',w)});$('status').textContent=tr('dlDone',{f:name+'.zip'})}catch(er){$('status').textContent=er&&er.code==='declined'?tr('dlCancel'):tr('dlNA')}}
    else{plainDownload(name+'.wav',w,'audio/wav');$('status').textContent=tr('dlDone',{f:name+'.wav'})}
  }catch(er){$('status').textContent=tr('err')+er.message}
  $('exp').disabled=false;
};
$('save').onclick=async()=>{if(!DL){plainDownload('ferryfree-projekt.json',JSON.stringify(st,null,1),'application/json');$('status').textContent=tr('projSaved');return}try{await DL.save({filename:'ferryfree-projekt.json',data:JSON.stringify(st,null,1)});$('status').textContent=tr('projSaved')}catch(_){$('status').textContent=tr('saveFail')}};
$('loadb').onclick=()=>$('loadf').click();
function merge(o){const n=Object.assign(JSON.parse(JSON.stringify(DEF)),o);n.drums=Object.assign(emptyDrums(),o.drums||{});n.vol=Object.assign({},DEF.vol,o.vol||{});n.mute=o.mute||{};n.clips=Array.isArray(o.clips)?o.clips:[];n.lanes=Array.from({length:8},(_,i)=>Object.assign({clip:null,on:false,vol:.8},(o.lanes||[])[i]||{}));n.cparts=Object.assign({},DEF.cparts,o.cparts||{});return n}
$('loadf').onchange=async()=>{const f=$('loadf').files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.drums||!o.prog)throw 0;snap();st=merge(o);if(LE)setGains(LE);render();$('status').textContent=tr('projLoaded')}catch(_){$('status').textContent=tr('notProj')}$('loadf').value=''};

let saved=null;try{saved=JSON.parse(localStorage.getItem('ferryfree')||localStorage.getItem('soundmaker'))}catch(_){}
if(saved&&saved.drums&&saved.prog)st=merge(saved);else generate('nyugodt');
$('lang').addEventListener('click',ev=>{const b=ev.target.closest('[data-lang]');if(!b)return;LANG=b.dataset.lang;try{localStorage.setItem('ferryfree-lang2',LANG)}catch(_){}applyLang();render()});
applyLang();
render();
for(const c of st.clips)if(c.type==='audio')idb('get',c.id).then(v=>{if(v){AUD[c.id]=v;if(LE)LE.ctx.decodeAudioData(v.slice(0)).then(b=>{LE.dec[c.id]=b}).catch(()=>{})}render()});
}
